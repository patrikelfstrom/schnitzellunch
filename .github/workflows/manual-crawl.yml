name: Manual crawl

on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Run once for each day
    steps:
      - name: Trigger Crawl Monday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=1
      - name: Trigger Crawl Tuesday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=2
      - name: Trigger Crawl Wednesday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=3
      - name: Trigger Crawl Thursday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=4
      - name: Trigger Crawl Friday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=5
      - name: Trigger Crawl Saturday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=6
      - name: Trigger Crawl Sunday
        run: curl --fail-with-body https://schnitzellunch.se/api/restaurants-recrawl?weekDay=7
  geocode:
    runs-on: ubuntu-latest
    needs: crawl
    steps:
      - name: Geocode addresses in batches
        shell: bash
        run: |
          set -euo pipefail
          cursor=""
          while true; do
            args=(--fail-with-body --silent --show-error --get)
            if [[ -n "$cursor" ]]; then
              args+=(--data-urlencode "cursor=$cursor")
            fi
            result=$(curl "${args[@]}" https://schnitzellunch.se/api/geocode)
            cursor=$(jq -r '.nextCursor // empty' <<< "$result")
            [[ -n "$cursor" ]] || break
            sleep 1.1
          done
